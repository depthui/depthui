<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Depth UI: copy-paste 3D React components built on Tailwind CSS v4 and Framer Motion. CSS transforms, no WebGL, light and dark themes." />
    <meta name="theme-color" content="#7c3aed" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Depth UI — 3D components for React" />
    <meta property="og:description" content="Copy-paste 3D React components. CSS transforms, no WebGL. Tailwind v4 + Framer Motion, light and dark." />
    <meta property="og:url" content="https://depthui.github.io/depthui/" />
    <meta property="og:image" content="https://depthui.github.io/depthui/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the saved/system theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem("depth-theme");
          var dark = t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
    <title>Depth UI — 3D components for React</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
