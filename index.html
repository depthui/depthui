<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Depth UI is a free, open-source library of 100+ copy-paste 3D React components. Tilt cards, 3D carousels, globes, dice, form controls and more. CSS transforms, no WebGL. Tailwind CSS v4 + Framer Motion, light and dark." />
    <meta name="keywords" content="3D React components, CSS 3D, React component library, Tailwind CSS v4, Framer Motion, copy-paste components, shadcn alternative, 3D UI, open source" />
    <link rel="canonical" href="https://depthui.vercel.app/" />
    <meta name="theme-color" content="#7c3aed" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Depth UI — 3D components for React" />
    <meta property="og:description" content="Copy-paste 3D React components. CSS transforms, no WebGL. Tailwind v4 + Framer Motion, light and dark." />
    <meta property="og:url" content="https://depthui.vercel.app/" />
    <meta property="og:site_name" content="Depth UI" />
    <meta property="og:image" content="https://depthui.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Depth UI: 3D components for React" />

    <meta name="twitter:image" content="https://depthui.vercel.app/og.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareSourceCode",
        "name": "Depth UI",
        "description": "Free, open-source copy-paste 3D React components built on Tailwind CSS v4 and Framer Motion.",
        "url": "https://depthui.vercel.app/",
        "codeRepository": "https://github.com/depthui/depthui",
        "programmingLanguage": "TypeScript",
        "runtimePlatform": "React",
        "license": "https://opensource.org/licenses/MIT",
        "image": "https://depthui.vercel.app/og.png"
      }
    </script>
    <script>
      // Apply the saved/system theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem("depth-theme");
          var dark = t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
    <title>Depth UI — 3D components for React</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>Depth UI: copy-paste 3D React components</h1>
      <p>A free, open-source library of 3D React components built with CSS transforms, Tailwind CSS v4 and Framer Motion. No WebGL.</p>
      <p><a href="https://github.com/depthui/depthui">Source on GitHub</a> · <a href="https://depthui.vercel.app/components">Component docs</a></p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
